<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Networks - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
        <div class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-purple-500 to-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-purple-500/30">
                    <i class="fas fa-shield-alt text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white">Orbit Networks</h1>
                <p class="text-gray-400 mt-2">Admin Portal</p>
                <p class="text-xs text-red-400 mt-1">🔒 Secure Admin Access Only</p>
            </div>

            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Admin Email</label>
                    <input type="email" id="adminEmail" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                           placeholder="admin@orbitnetworks.ke" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Admin Password</label>
                    <input type="password" id="adminPassword" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                           placeholder="••••••••" />
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="adminRemember" class="w-4 h-4 bg-white/5 border border-white/10 rounded">
                    <label for="adminRemember" class="text-sm text-gray-400">Remember me</label>
                </div>
                <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-purple-500 to-red-600 text-white font-semibold rounded-lg hover:shadow-lg hover:shadow-purple-500/30 transition-all duration-300">
                    <i class="fas fa-sign-in-alt mr-2"></i> Admin Sign In
                </button>
                <div id="adminLoginError" class="text-red-400 text-sm text-center hidden"></div>
            </form>

            <div class="text-center mt-6">
                <a href="/orbitnetworks/" class="text-gray-400 hover:text-gray-300 text-sm">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Customer Login
                </a>
            </div>

            <p class="text-center text-gray-400 text-sm mt-6">
                &copy; 2026 Orbit Networks. All rights reserved.
            </p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>
    <script type="module">
        import { AuthService } from '../js/services/auth.service.js';
        import { showToast } from '../js/utils/helpers.js';

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            const result = await AuthService.login(email, password);
            
            if (result.success) {
                // Check if user has admin role
                if (AuthService.isAdmin()) {
                    window.location.href = '/orbitnetworks/admin/dashboard.html';
                } else {
                    document.getElementById('adminLoginError').textContent = 'You do not have admin access.';
                    document.getElementById('adminLoginError').classList.remove('hidden');
                    showToast('Access denied. Admin privileges required.', 'error');
                }
            } else {
                document.getElementById('adminLoginError').textContent = result.error;
                document.getElementById('adminLoginError').classList.remove('hidden');
                showToast('Login failed: ' + result.error, 'error');
            }
        });
    </script>
</body>
</html>
