<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Networks - Customer Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ============================================================
           THEME TOGGLE STYLES
           ============================================================ */
        .theme-toggle {
            position: relative;
            width: 48px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            border-color: rgba(14, 165, 233, 0.3);
        }

        .theme-toggle .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .theme-toggle.light .toggle-thumb {
            left: 25px;
            background: #0f0f1a;
        }

        .theme-toggle .toggle-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .theme-toggle .toggle-icon.sun {
            left: 6px;
            color: #fbbf24;
        }

        .theme-toggle .toggle-icon.moon {
            right: 6px;
            color: #94a3b8;
        }

        .theme-toggle.light .toggle-icon.sun {
            opacity: 1;
        }

        .theme-toggle.light .toggle-icon.moon {
            opacity: 0.3;
        }

        .theme-toggle:not(.light) .toggle-icon.sun {
            opacity: 0.3;
        }

        .theme-toggle:not(.light) .toggle-icon.moon {
            opacity: 1;
        }

        /* ============================================================
           LIGHT THEME OVERRIDES
           ============================================================ */
        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --sidebar-border: rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-body: #0f0f1a;
            --bg-surface: #1a1a2e;
            --bg-card: #1a1a2e;
            --bg-card-hover: #24243a;
            --bg-sidebar: #111827;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --sidebar-border: rgba(255, 255, 255, 0.05);
        }

        /* Apply theme variables */
        body {
            background: var(--bg-body);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .sidebar {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--sidebar-border);
        }

        .sidebar-header {
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-header .border-t {
            border-color: var(--sidebar-border) !important;
        }

        .card, .stat-card, .admin-stat-card, .admin-chart-card, .admin-activity-card, .admin-quick-actions-card {
            background: var(--bg-card);
            border-color: var(--border-color);
            box-shadow: var(--shadow);
        }

        .stat-card:hover, .admin-stat-card:hover {
            border-color: rgba(14, 165, 233, 0.3);
        }

        .nav-link {
            color: var(--text-muted);
        }

        .nav-link:hover {
            background: rgba(14, 165, 233, 0.08);
            color: var(--text-primary);
        }

        .nav-link.active {
            background: rgba(14, 165, 233, 0.12);
            color: #60a5fa;
        }

        .sidebar-footer {
            border-top: 1px solid var(--sidebar-border);
        }

        .logout-btn {
            color: var(--text-muted);
            border-color: var(--border-color);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #ef4444;
        }

        .content {
            background: var(--bg-body);
        }

        .admin-stat-mini {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        .bg-white\/5 {
            background: var(--bg-glass) !important;
        }

        .border-white\/10 {
            border-color: var(--border-color) !important;
        }

        .border-white\/5 {
            border-color: var(--border-color) !important;
        }

        .text-gray-400, .text-gray-500 {
            color: var(--text-muted) !important;
        }

        .text-gray-300 {
            color: var(--text-secondary) !important;
        }

        .text-white {
            color: var(--text-primary) !important;
        }

        .bg-white\/10 {
            background: var(--bg-glass) !important;
        }

        .hover\:bg-white\/10:hover {
            background: rgba(14, 165, 233, 0.05) !important;
        }

        .hover\:bg-white\/5:hover {
            background: rgba(14, 165, 233, 0.03) !important;
        }

        .package-card {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        .router-card {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        .table-container {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        thead {
            background: rgba(14, 165, 233, 0.03);
        }

        th {
            color: var(--text-muted);
            border-bottom-color: var(--border-color);
        }

        td {
            border-bottom-color: rgba(255, 255, 255, 0.03);
        }

        tr:hover td {
            background: rgba(14, 165, 233, 0.02);
        }

        .form-group input, .form-group select, .form-group textarea {
            background: var(--bg-glass);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #0ea5e9;
        }

        .form-group label {
            color: var(--text-secondary);
        }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-secondary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(14, 165, 233, 0.08);
        }

        #loginPage {
            background: var(--bg-body);
        }

        .login-card {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        /* Toast theme */
        .toast {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
        }
    </style>
</head>
<body>
    <div id="loginPage" class="min-h-screen flex items-center justify-center">
        <div class="login-card bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                    <i class="fas fa-satellite-dish text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white">Orbit Networks</h1>
                <p class="text-gray-400 mt-2">Customer Portal</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Email or Phone</label>
                    <input type="text" id="email" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="john@example.com or 0712345678" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="••••••••" />
                </div>
                <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg hover:shadow-blue-500/30 transition-all duration-300">
                    <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                </button>
                <div id="loginError" class="text-red-400 text-sm text-center hidden"></div>
            </form>

            <!-- Admin Login Link -->
            <div class="text-center mt-4">
                <a href="/orbitnetworks/admin/login.html" class="text-sm text-purple-400 hover:text-purple-300 transition">
                    <i class="fas fa-shield-alt mr-1"></i> Admin Login
                </a>
                <span class="text-gray-600 mx-2">|</span>
                <a href="#" class="text-sm text-blue-400 hover:text-blue-300 transition">
                    Forgot Password?
                </a>
            </div>

            <p class="text-center text-gray-400 text-sm mt-6">
                &copy; 2026 Orbit Networks. All rights reserved.
            </p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>
   <script type="module" src="js/login.js"></script>
</body>
</html>
