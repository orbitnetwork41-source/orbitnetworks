<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Networks - WiFi Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
        <div class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                    <i class="fas fa-satellite-dish text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white">Orbit Networks</h1>
                <p class="text-gray-400 mt-2">WiFi Billing & Management</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                    <input type="email" id="email" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="admin@orbitnetworks.ke" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                           placeholder="••••••••" />
                </div>
                <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg hover:shadow-blue-500/30 transition-all duration-300">
                    <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                </button>
                <div id="loginError" class="text-red-400 text-sm text-center hidden"></div>
            </form>

            <p class="text-center text-gray-400 text-sm mt-6">
                &copy; 2026 Orbit Networks. All rights reserved.
            </p>
        </div>
    </div>

    <!-- Main App (hidden until login) -->
    <div id="app" class="hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="flex items-center gap-3">
                    <i class="fas fa-satellite-dish text-blue-400 text-2xl"></i>
                    <span class="text-xl font-bold text-white">Orbit</span>
                </div>
                <div class="mt-4 pt-4 border-t border-white/10">
                    <p class="text-sm text-white font-medium" id="userName">Admin</p>
                    <p class="text-xs text-gray-400">Administrator</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-link active" data-page="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#customers" class="nav-link" data-page="customers">
                    <i class="fas fa-users"></i>
                    <span>Customers</span>
                </a>
                <a href="#packages" class="nav-link" data-page="packages">
                    <i class="fas fa-box"></i>
                    <span>Packages</span>
                </a>
                <a href="#payments" class="nav-link" data-page="payments">
                    <i class="fas fa-credit-card"></i>
                    <span>Payments</span>
                </a>
                <a href="#routers" class="nav-link" data-page="routers">
                    <i class="fas fa-router"></i>
                    <span>Routers</span>
                </a>
                <a href="#reports" class="nav-link" data-page="reports">
                    <i class="fas fa-chart-bar"></i>
                    <span>Reports</span>
                </a>
                <a href="#settings" class="nav-link" data-page="settings">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div id="dashboardPage" class="page-content active">
                <!-- Dashboard content -->
            </div>
            <div id="customersPage" class="page-content hidden">
                <!-- Customers content -->
            </div>
            <div id="packagesPage" class="page-content hidden">
                <!-- Packages content -->
            </div>
            <div id="paymentsPage" class="page-content hidden">
                <!-- Payments content -->
            </div>
            <div id="routersPage" class="page-content hidden">
                <!-- Routers content -->
            </div>
            <div id="reportsPage" class="page-content hidden">
                <!-- Reports content -->
            </div>
            <div id="settingsPage" class="page-content hidden">
                <!-- Settings content -->
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
